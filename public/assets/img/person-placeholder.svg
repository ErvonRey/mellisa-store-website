<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img"
     aria-label="Placeholder image for a person photo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>

  <!-- Faint grid so the image reads as "temporary". -->
  <g stroke="#2b2b2b" stroke-width="1">
    <path d="M0 150h600M0 300h600M0 450h600M0 600h600"/>
    <path d="M150 0v750M300 0v750M450 0v750"/>
  </g>

  <!-- Accent frame -->
  <rect x="18" y="18" width="564" height="714" fill="none" stroke="#ffc72c"
        stroke-width="3" stroke-dasharray="14 12"/>
  <rect x="18" y="724" width="564" height="8" fill="#d62828"/>

  <!-- Simple portrait silhouette -->
  <g fill="#2b2b2b">
    <circle cx="300" cy="290" r="95"/>
    <path d="M140 690c0-88 72-160 160-160s160 72 160 160Z"/>
  </g>

  <g text-anchor="middle" font-family="system-ui, Segoe UI, Arial, sans-serif">
    <text x="300" y="360" fill="#ffc72c" font-size="52" font-weight="800"
          letter-spacing="4">PHOTO</text>
    <text x="300" y="410" fill="#f5f5f5" font-size="24" font-weight="600"
          letter-spacing="2">GOES HERE</text>
  </g>
</svg>