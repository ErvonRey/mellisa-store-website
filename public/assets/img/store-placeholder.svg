<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"
     aria-label="Placeholder image for the store photo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Faint grid so the image reads as "temporary". -->
  <g stroke="#2b2b2b" stroke-width="1">
    <path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/>
    <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/>
  </g>

  <!-- Accent frame -->
  <rect x="24" y="24" width="1552" height="852" fill="none" stroke="#ffc72c"
        stroke-width="3" stroke-dasharray="18 14"/>
  <rect x="24" y="868" width="1552" height="8" fill="#d62828"/>

  <g text-anchor="middle" font-family="system-ui, Segoe UI, Arial, sans-serif">
    <text x="800" y="400" fill="#ffc72c" font-size="96" font-weight="800"
          letter-spacing="8">PLACEHOLDER</text>
    <text x="800" y="470" fill="#f5f5f5" font-size="40" font-weight="600"
          letter-spacing="4">STORE PHOTO GOES HERE</text>
    <text x="800" y="530" fill="#a6a6a6" font-size="30"
          letter-spacing="2">Replace assets/img/store-placeholder.svg with the real photo</text>
  </g>
</svg>